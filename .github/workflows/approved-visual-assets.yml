name: Verify approved prize photographs and video previews
on:
  push:
    branches: [review/approved-visual-assets-20260906]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: startupfair-approved-visual-assets
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct and verify owner-approved photographs
        run: |
          python -m pip install Pillow==12.3.0
          python scripts/integrate-approved-prize-photos.py
      - name: Install locked application and isolated test tools
        run: |
          npm ci
          npm install --prefix /tmp/sf-poster-tools --no-audit --no-fund playwright@1.58.2
          /tmp/sf-poster-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Compile application and preserve email routing
        run: |
          mkdir -p approved-visual-evidence
          npm run build > approved-visual-evidence/build.log 2>&1
          node --experimental-strip-types --test tests/email-routing.test.mjs > approved-visual-evidence/email-routing.log 2>&1
      - name: Verify gallery, initial posters, players and existing popup
        run: |
          bash scripts/codespaces-start.sh
          node scripts/verify-approved-visual-assets.mjs
          node --experimental-strip-types scripts/verify-telecast-posters.mjs
      - name: Commit only verified display assets and the two source references
        run: |
          set -euo pipefail
          git diff --exit-code -- app components/event-telecasts.tsx components/ui/dialog.tsx lib public/history/homeslide2.png public/history/29.jpg public/startupfair-hero-global-ai.png public/startupfair-logo.png public/telecast-posters package.json package-lock.json
          git add components/startupfair-page.tsx public/history/homeslide2-branding-edited.png public/history/september-2015-branding-edited.png docs/approved-prize-photo-assets.json
          if ! git diff --cached --quiet; then
            git config user.name 'StartupFair Verification'
            git config user.email 'actions@users.noreply.github.com'
            git commit -m 'Use approved Divensi-removed prize photos; preserve original archives and visible video posters'
            git push origin HEAD:review/approved-visual-assets-20260906
          fi
          git rev-parse HEAD > approved-visual-evidence/verified-commit.txt
      - name: Preserve exact test evidence
        if: always()
        run: |
          mkdir -p approved-visual-evidence
          cp /tmp/startupfair-vite.log approved-visual-evidence/server.log 2>/dev/null || true
          cp docs/approved-prize-photo-assets.json approved-visual-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startupfair-approved-visual-assets
          path: |
            approved-visual-evidence/
            telecast-evidence/
          retention-days: 14
