name: Test live StartupFair asset
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact live hero
        run: |
          set -euxo pipefail
          curl -fL --retry 2 -o /tmp/hero.png "https://startupfair-ai-challenges.pksamal.chatgpt.site/startupfair-hero-global-ai.png"
          file /tmp/hero.png
          wc -c /tmp/hero.png
          test "$(wc -c < /tmp/hero.png)" -gt 100000
