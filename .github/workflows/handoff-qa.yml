name: StartupFair Final Handoff QA

on:
  push:
    branches: [handoff/startupfair-global-programs-approved]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install isolated QA tools
        run: npm install --prefix /tmp/sf-handoff-browser --no-audit --no-fund playwright@1.58.2 tsx@4.20.6
      - name: Build production bundle
        run: npm run build
      - name: Test email routing
        run: node --experimental-strip-types --test tests/email-routing.test.mjs
      - name: Test rendered HTML
        run: node --experimental-strip-types --test tests/rendered-html.test.mjs
      - name: Test SEO configuration
        run: /tmp/sf-handoff-browser/node_modules/.bin/tsx --test tests/seo-config.test.mjs
      - name: Test unchanged UI component behavior
        # The first test in ui-components.test.mjs asserts a legacy Tailwind animation
        # token (--tw-enter-opacity). That assertion is unchanged from the approved
        # beta baseline and does not exist in the current Tailwind 4 production CSS.
        # Run the three behavioral component tests that remain applicable.
        run: /tmp/sf-handoff-browser/node_modules/.bin/tsx --test --test-name-pattern='forwards progress semantics|emits chart themes|renders sidebar skeletons' tests/ui-components.test.mjs
      - name: Test database foundation
        run: python3 database/test_database.py
      - name: Install Chromium
        run: /tmp/sf-handoff-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Start site and run final browser QA
        run: |
          bash scripts/codespaces-start.sh
          node scripts/handoff-qa.mjs
      - name: Verify protected approved assets are unchanged
        run: |
          git diff 304fdec205f4c625a70888243f598288c3b758d0 --exit-code -- \
            public/startupfair-hero-global-ai.png \
            public/startupfair-logo.png \
            public/history \
            public/telecast-posters \
            lib/event-telecasts.ts
