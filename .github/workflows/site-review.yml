name: StartupFair Site Review
on:
  push:
    branches: [site-template-database-review]
    paths-ignore: ['docs/form-field-inventory.json','docs/SITE-REVIEW-RESULTS.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: startupfair-site-template-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install unchanged site dependencies and isolated browser tools
        run: |
          npm ci
          npm install --prefix /tmp/sf-browser --no-audit --no-fund playwright@1.58.2
          /tmp/sf-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture before review
        run: |
          bash scripts/codespaces-start.sh
          node scripts/review-browser.mjs before
      - name: Apply source-guarded template review and preserve archive photographs
        run: |
          if ! grep -q 'publicPage = false' components/startupfair-page.tsx; then
            python3 scripts/apply-template-review.py
            python3 scripts/cache-historical-images.py
            python3 - <<'PY'
          from pathlib import Path
          p=Path('app/layout.tsx');s=p.read_text();s=s.replace('import "./public-template.css";', 'import "./public-template.css";\nimport "./review-gallery.css";');p.write_text(s)
          PY
          fi
      - name: Verify all email routes and database constraints
        run: |
          node --experimental-strip-types --test tests/email-routing.test.mjs
          python3 database/test_database.py
      - name: Browser verification after review
        run: |
          bash scripts/codespaces-start.sh
          node scripts/review-browser.mjs after
      - name: Verify actual clicks and Home preservation
        run: |
          node scripts/review-interactions.mjs
          git diff --exit-code -- app/globals.css app/home-review.css app/inquiry-fix.css components/ui/dialog.tsx public/startupfair-hero-global-ai.png public/startupfair-logo.png
      - name: Record results and commit verified changes to review branch only
        run: |
          python3 scripts/write-review-report.py
          git add components/startupfair-page.tsx app/layout.tsx app/about-history.css docs/form-field-inventory.json docs/historical-image-manifest.json docs/SITE-REVIEW-RESULTS.md public/history
          if ! git diff --cached --quiet; then
            git config user.name 'StartupFair Review'
            git config user.email 'actions@users.noreply.github.com'
            git commit -m 'Apply browser-verified public templates and recover approved About content'
            git push origin HEAD:site-template-database-review
          fi
      - name: Preserve source snapshot
        if: always()
        run: |
          mkdir -p review-evidence
          git archive --format=zip -o review-evidence/startupfair-review-source.zip HEAD
          cp docs/historical-image-manifest.json review-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startupfair-review-evidence
          path: review-evidence
          retention-days: 7
