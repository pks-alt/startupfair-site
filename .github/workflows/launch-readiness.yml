name: StartupFair video and headline verification
on:
  push:
    branches: [audit/launch-readiness-20260906]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: startupfair-telecast-headline
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the exact requested presentation changes
        run: |
          mkdir -p launch-audit
          python3 scripts/apply-telecasts-headline.py
      - name: Install locked site and isolated browser tools
        run: |
          npm ci
          npm install --prefix /tmp/sf-launch-tools --no-audit --no-fund playwright@1.58.2
          /tmp/sf-launch-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Compile site and verify unchanged email routing
        run: |
          npm run build > launch-audit/build.log 2>&1
          node --experimental-strip-types --test tests/email-routing.test.mjs > launch-audit/email-tests.log 2>&1
          python3 database/test_database.py > launch-audit/database-tests.log 2>&1
      - name: Verify Home typography, video components and existing popup in a browser
        run: |
          bash scripts/codespaces-start.sh
          node --experimental-strip-types scripts/test-telecasts-headline.mjs
      - name: Commit tested presentation changes only to the audit branch
        run: |
          set -euo pipefail
          git diff --exit-code -- app/globals.css app/home-review.css app/inquiry-fix.css app/about-history.css app/public-template.css components/ui/dialog.tsx public lib/email-routing.ts components/email-routing-form.tsx package.json package-lock.json
          git add components/startupfair-page.tsx app/layout.tsx
          if ! git diff --cached --quiet; then
            git config user.name 'StartupFair Verification'
            git config user.email 'actions@users.noreply.github.com'
            git commit -m 'Restore two Event Telecasts and keep Home headline on two lines'
            git push origin HEAD:audit/launch-readiness-20260906
          fi
          git rev-parse HEAD > launch-audit/verified-commit.txt
          git archive --format=zip HEAD > launch-audit/verified-source.zip
      - name: Retain precise evidence and startup diagnostics
        if: always()
        run: |
          mkdir -p launch-audit
          cp /tmp/startupfair-vite.log launch-audit/server.log 2>/dev/null || true
          cp docs/PRELAUNCH-FINDINGS.md launch-audit/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startupfair-video-headline-review
          path: launch-audit
          retention-days: 14
