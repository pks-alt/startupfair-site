name: Preview Smoke Test
on:
  push:
    branches: [preview-codespaces]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start preview and verify
        run: |
          bash scripts/codespaces-start.sh
          curl -fsS http://127.0.0.1:5173/ | grep -q "StartupFair"
          echo "StartupFair responded successfully on port 5173"
