name: StartupFair Full Platform Frontend QA

on:
  push:
    branches:
      - handoff/startupfair-full-platform-integrated
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/platform-qa.mjs
# integrated-platform QA trigger after source-check correction
